 <pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 3H12M3 0V12" stroke="#FFD3E5" stroke-width="2"/></pattern>
 <mask id="front-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="856" height="540"><rect width="856" height="540" rx="32" fill="white"/><rect x="100" y="178" width="131" height="106" rx="16" fill="black"/></mask>
 <mask id="back-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="856" height="540"><rect width="856" height="540" rx="32" fill="white"/><rect y="70" width="856" height="120" fill="black"/></mask>
 <g id="chip"><rect x="108" y="186" width="115" height="90" rx="11" fill="#E2C48C" stroke="#AE8D54" stroke-width="3"/><path d="M145 186V276M186 186V276M108 215H145M108 247H145M186 215H223M186 247H223M145 202H186M145 260H186" stroke="#9D7D45" stroke-width="3" fill="none"/></g>
 <g id="plain-card"><rect width="856" height="540" rx="32" fill="#36313F"/><rect x="2" y="2" width="852" height="536" rx="30" fill="none" stroke="#5A5262" stroke-width="3"/><use href="#chip"/></g>
 <g id="artwork"><rect width="856" height="540" fill="#FF2D8D"/><path d="M-80 450C100 45 450 680 960 140" stroke="#19171F" stroke-width="190" fill="none"/><path d="M-80 450C100 45 450 680 960 140" stroke="#F7F5F8" stroke-width="72" fill="none"/><circle cx="675" cy="120" r="75" fill="#FFBBD7"/><circle cx="675" cy="120" r="29" fill="#19171F"/></g>
 <g id="front-skin"><g mask="url(#front-mask)"><use href="#artwork"/></g></g>
 <g id="finished-front"><use href="#plain-card"/><use href="#front-skin"/></g>
 <g id="finished-back"><rect width="856" height="540" rx="32" fill="#D9D4DF"/><rect y="70" width="856" height="120" fill="#26232E"/><g mask="url(#back-mask)"><use href="#artwork"/></g></g>
