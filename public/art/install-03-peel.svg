<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc"><title id="title">Peel a small part of the release liner</title><desc id="desc">A small strip of backing paper folds away while most of the liner remains under the sticker.</desc>
<defs>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#241E2B" flood-opacity=".16"/></filter>
